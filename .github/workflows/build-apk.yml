name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android loyihasini yaratish
        run: |
          flutter create --platforms=android --org uz.inoyat --project-name mafia_uz .
          sed -i 's/android:label="[^"]*"/android:label="Mafiya"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - run: flutter analyze --no-fatal-infos
      - run: flutter test

      - run: flutter build apk --release

      - name: Release yaratish
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Mafiya APK #${{ github.run_number }}
          files: build/app/outputs/flutter-apk/app-release.apk
