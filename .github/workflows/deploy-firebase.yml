name: Deploy Firebase Backend

on:
  push:
    branches: [main]
    paths:
      - "functions/**"
      - "firebase.json"
      - "firestore.rules"
      - "firestore.indexes.json"
      - ".github/workflows/deploy-firebase.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-backend
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        working-directory: functions
        run: npm install --omit=dev
      - name: Check JavaScript syntax
        working-directory: functions
        run: node --check index.js

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Verify Firebase deploy credential
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: test -n "$FIREBASE_SERVICE_ACCOUNT"

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Authenticate Google Cloud with service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          test -s "$RUNNER_TEMP/firebase-service-account.json"
          node -e "const fs=require('fs'); const p=process.env.RUNNER_TEMP+'/firebase-service-account.json'; const j=JSON.parse(fs.readFileSync(p,'utf8')); if(j.type!=='service_account'||!j.client_email||!j.private_key){throw new Error('FIREBASE_SERVICE_ACCOUNT is not a valid service-account JSON key')}; console.log('Service account:',j.client_email); console.log('Project:',j.project_id)"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/firebase-service-account.json" --quiet
          gcloud config set project mafia-uz-82794 --quiet
          gcloud auth print-access-token >/dev/null

      - name: Verify Firebase CLI authentication
        run: |
          FIREBASE_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          test -n "$FIREBASE_ACCESS_TOKEN"
          firebase projects:list --token "$FIREBASE_ACCESS_TOKEN" --non-interactive --json

      - name: Deploy rules, indexes and functions
        run: |
          FIREBASE_ACCESS_TOKEN="$(gcloud auth print-access-token)"
          firebase deploy --project mafia-uz-82794 --only firestore:rules,firestore:indexes,functions --token "$FIREBASE_ACCESS_TOKEN" --non-interactive
